<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NFCSOUND | Pazharnik</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    .wrapper {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10vh 0 8vh 0;
      cursor: pointer;
      z-index: 2;
    }

    /* Размытый задний фон */
    .bg-blur {
      position: fixed;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      background-image: url('image.png');
      background-size: cover;
      background-position: center;
      filter: blur(40px) brightness(0.5);
      z-index: 1;
      transform: scale(1.1);
    }

    /* Контейнер аватарки */
    .avatar-wrapper {
      position: relative;
      z-index: 2;
      /* Ультрабыстрая анимация возврата */
      transition: transform 0.05s cubic-bezier(0.1, 0.9, 0.2, 1);
      will-change: transform;
    }

    /* Быстрый класс сжатия, управляемый через JS */
    .avatar-wrapper.pressed {
      transform: scale(0.93);
    }

    .avatar {
      width: 86vw;
      height: 86vw;
      max-width: 380px;
      max-height: 380px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
    }

    /* Кнопка "ЗАГЛУШИТЬ" */
    .mute-btn {
      position: relative;
      z-index: 3;
      width: 78vw;
      max-width: 310px;
      padding: 16px 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 40px;
      cursor: pointer;
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease, visibility 0.3s;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .mute-btn.visible {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .mute-btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.22);
    }
  </style>
</head>
<body>

  <div class="bg-blur"></div>

  <div class="wrapper" id="click-area">
    <div class="avatar-wrapper" id="avatar-container">
      <img src="image.png" alt="Pazharnik" class="avatar">
    </div>

    <button id="mute-button" class="mute-btn">
      🔊 ЗАГЛУШИТЬ
    </button>
  </div>

  <audio id="alarm-sound" src="alarm.mp3" preload="auto" loop></audio>

  <script>
    const clickArea = document.getElementById('click-area');
    const avatarContainer = document.getElementById('avatar-container');
    const audio = document.getElementById('alarm-sound');
    const muteBtn = document.getElementById('mute-button');

    // Функция мгновенного пружинящего клика
    function triggerPulse() {
      avatarContainer.classList.remove('pressed');
      // Принудительный сброс кадров браузера для перезапуска анимации
      void avatarContainer.offsetWidth; 
      avatarContainer.classList.add('pressed');

      setTimeout(() => {
        avatarContainer.classList.remove('pressed');
      }, 50); // 50 миллисекунд — сочный и быстрый отклик
    }

    // Обработка быстрой анимации при любом прикосновении
    clickArea.addEventListener('pointerdown', (e) => {
      if (e.target === muteBtn || muteBtn.contains(e.target)) return;
      triggerPulse();
    });

    // Воспроизведение аудио
    clickArea.addEventListener('click', (e) => {
      if (e.target === muteBtn || muteBtn.contains(e.target)) return;

      if (audio.paused) {
        audio.play().then(() => {
          muteBtn.classList.add('visible');
        }).catch(err => {
          console.log("Ошибка воспроизведения:", err);
        });
      }
    });

    // Переход по кнопке
    muteBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      window.location.href = "https://t.me/WanTime_official";
    });
  </script>
</body>
</html>
